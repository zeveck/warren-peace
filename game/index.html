<style>
  @font-face { font-family: 'Pixelify'; src: url('fonts/PixelifySans.ttf') format('truetype'); font-display: block; }
  html, body { margin: 0; height: 100%; background: #17121f; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #screen { position: absolute; left: 0; top: 0; display: block; image-rendering: pixelated; outline: none; }
  #boot { visibility: hidden; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #efe8d6; font: 20px 'Pixelify', monospace; letter-spacing: 1px; }
  #boot .bar { width: 240px; height: 8px; border: 2px solid #efe8d6; margin-top: 12px; }
  #boot .fill { height: 100%; width: 0; background: #c9b458; }
  .tlink { position: absolute; bottom: max(10px, env(safe-area-inset-bottom)); display: none; font: 13px 'Pixelify', monospace; color: rgba(232,220,192,0.62); text-decoration: none; padding: 4px 6px; z-index: 5; }
  .tlink:hover, .tlink:focus { color: #f6e7b8; text-decoration: underline; }
  #tl-gallery { left: max(12px, env(safe-area-inset-left)); }
  #tl-github { right: max(12px, env(safe-area-inset-right)); }
  @media (max-width: 700px), (max-height: 420px) { .tlink { font-size: 11px; } }
  gh-feedback { -webkit-user-select: text; user-select: text; touch-action: auto;
    /* the report form in the game's own panel colours (engine/gfx.js panel, data/core/palette.js) */
    --gh-feedback-bg: #2b2236; --gh-feedback-text: #efe8d6; --gh-feedback-border: #6b5a7e; --gh-feedback-input-bg: #1d1726; }
  /* phones and tablets with touch only: the game is made for a computer, a controller or a keyboard */
  #touchnote { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    background: rgba(16,12,22,0.82); padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  #touchnote.show { display: flex; }
  #touchnote .box { max-width: 30em; background: #2b2236; border: 2px solid #6e5c84; border-radius: 6px; padding: 18px 20px; color: #efe8d6;
    font: 17px/1.45 'Pixelify', monospace; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,0.5); }
  #touchnote h2 { margin: 0 0 10px; font: 26px 'Pixelify', monospace; color: #f6e7b8; font-weight: normal; }
  #touchnote p { margin: 0 0 12px; }
  #touchnote .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
  #touchnote button { font: 17px 'Pixelify', monospace; color: #2b2236; background: #e0a030; border: 0; border-radius: 4px; padding: 10px 16px; min-height: 44px; cursor: pointer; }
  #touchnote button.quiet { background: transparent; color: #e8dcc0; text-decoration: underline; }
</style>
</head>
<body>
<canvas id="screen" tabindex="0" aria-label="Warren Peace game"></canvas>
<div id="boot"><div><div style="text-align:center">Warren Peace</div><div class="bar"><div class="fill" id="bootfill"></div></div></div></div>
<a id="tl-gallery" class="tlink" href="https://synapticnoise.com/" target="_blank" rel="noopener" title="More games at synapticnoise.com">synapticnoise.com</a>
<a id="tl-github" class="tlink" href="https://github.com/zeveck/warren-peace" target="_blank" rel="noopener" title="Warren Peace on GitHub: how it was made">GitHub</a>
<script>
  // the two small links show on the title screen only (window.__wpOnTitle comes from src/main.js)
  (function tick() {
    const on = !!(window.__wpOnTitle && window.__wpOnTitle());
    for (const id of ['tl-gallery', 'tl-github']) { const a = document.getElementById(id); if (a) a.style.display = on ? 'block' : 'none'; }
    requestAnimationFrame(tick);
  })();
</script>
<script>
  // Ctrl+Shift+F opens "Report a bug" from anywhere, even if the game is stuck (its own script, before the game's code).
  // Ctrl on a Mac too. F alone (the army battle's speed key) still reaches the game; Ctrl+Shift+F is stopped here.
  addEventListener('keydown', (e) => {
    if (!e.ctrlKey || !e.shiftKey || e.altKey || e.metaKey || e.code !== 'KeyF') return;
    const fb = document.getElementById('report');
    if (!fb?.getAttribute('repo') || document.activeElement === fb) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    try { window.reportShortcut?.(); } catch {}   // the game pauses, if it still can
    fb.open();
  }, true);
</script>
<div id="touchnote" role="dialog" aria-modal="true" aria-labelledby="tn-title">
  <div class="box">
    <h2 id="tn-title">Warren Peace</h2>
    <p>This game is made for a computer, or a device with a controller or keyboard.</p>
    <p>With touch alone you can look around, but the army battles can't be played, and the text is small on a phone.</p>
    <p>Press any button on a controller or any key to play.</p>
    <div class="btns"><button id="tn-copy" type="button">Copy link for later</button><button id="tn-look" type="button" class="quiet">Look around anyway</button></div>
  </div>
</div>
<script>
  // shown only on touch-only devices (no mouse or trackpad anywhere), until the player dismisses it once
  (function () {
    const KEY = 'warren-peace-touchnote';
    const fine = window.matchMedia && matchMedia('(any-pointer: fine)').matches;
    const touch = (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
    let seen = false; try { seen = localStorage.getItem(KEY) === '1'; } catch (e) {}
    if (fine || !touch || seen) return;
    const el = document.getElementById('touchnote'); el.classList.add('show');
    let open = true;
    const close = () => { if (!open) return; open = false; el.classList.remove('show'); try { localStorage.setItem(KEY, '1'); } catch (e) {} };
    document.getElementById('tn-look').addEventListener('click', close);
    const copy = document.getElementById('tn-copy');
    copy.addEventListener('click', () => {
      const url = location.origin + location.pathname;
      const done = () => { copy.textContent = 'Link copied'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => { copy.textContent = url; });
      else copy.textContent = url;
    });
    addEventListener('keydown', close, { capture: true });
    // a controller press dismisses it too (guarded: some browsers block the Gamepad API)
    (function poll() {
      if (!open) return;
      try { if (typeof navigator.getGamepads === 'function') for (const p of navigator.getGamepads()) if (p && p.buttons.some(b => b.pressed)) { close(); return; } } catch (e) { return; }
      requestAnimationFrame(poll);
    })();
  })();
</script>
<script type="module" src="vendor/gh-feedback.js"></script>
<gh-feedback id="report" trigger="none" repo="zeveck/warren-peace" template="bug.yml" types="bug,feature" theme="dark" color="#e8c95a" popup-color="#9a6a2a"></gh-feedback>
<script type="module" src="src/main.js"></script>
<script>
  const local = ['localhost', '127.0.0.1'].includes(location.hostname);
  if ('serviceWorker' in navigator && (!local || new URLSearchParams(location.search).has('sw'))) {
    // a waiting update is applied only while the title screen is up (never mid-game: see sw.js), then the page reloads
    let asked = false;
    navigator.serviceWorker.register('sw.js').then(reg => setInterval(() => {
      if (!asked && reg.waiting && navigator.serviceWorker.controller && window.__wpOnTitle && window.__wpOnTitle()) { asked = true; reg.waiting.postMessage('skipWaiting'); }
    }, 2000));
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (asked && window.__wpOnTitle && window.__wpOnTitle()) location.reload(); });
  }
</script>
</body>
</html>
