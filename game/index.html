<style>
  @font-face { font-family: 'Pixelify'; src: url('fonts/PixelifySans.ttf') format('truetype'); font-display: block; }
  html, body { margin: 0; height: 100%; background: #17121f; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #screen { position: absolute; left: 0; top: 0; display: block; image-rendering: pixelated; outline: none; }
  #boot { visibility: hidden; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #efe8d6; font: 20px 'Pixelify', monospace; letter-spacing: 1px; }
  #boot .bar { width: 240px; height: 8px; border: 2px solid #efe8d6; margin-top: 12px; }
  #boot .fill { height: 100%; width: 0; background: #c9b458; }
  .tlink { position: absolute; bottom: max(10px, env(safe-area-inset-bottom)); display: none; font: 13px 'Pixelify', monospace; color: rgba(232,220,192,0.62); text-decoration: none; padding: 4px 6px; z-index: 5; }
  .tlink:hover, .tlink:focus { color: #f6e7b8; text-decoration: underline; }
  #tl-gallery { left: max(12px, env(safe-area-inset-left)); }
  #tl-github { right: max(12px, env(safe-area-inset-right)); }
  @media (max-width: 700px), (max-height: 420px) { .tlink { font-size: 11px; } }
  gh-feedback { -webkit-user-select: text; user-select: text; touch-action: auto; }
</style>
</head>
<body>
<canvas id="screen" tabindex="0" aria-label="Warren Peace game"></canvas>
<div id="boot"><div><div style="text-align:center">Warren Peace</div><div class="bar"><div class="fill" id="bootfill"></div></div></div></div>
<a id="tl-gallery" class="tlink" href="https://synapticnoise.com/" target="_blank" rel="noopener" title="More games at synapticnoise.com">synapticnoise.com</a>
<a id="tl-github" class="tlink" href="https://github.com/zeveck/warren-peace" target="_blank" rel="noopener" title="Warren Peace on GitHub: how it was made">GitHub</a>
<script>
  // the two small links show on the title screen only (window.__wpOnTitle comes from src/main.js)
  (function tick() {
    const on = !!(window.__wpOnTitle && window.__wpOnTitle());
    for (const id of ['tl-gallery', 'tl-github']) { const a = document.getElementById(id); if (a) a.style.display = on ? 'block' : 'none'; }
    requestAnimationFrame(tick);
  })();
</script>
<script type="module" src="vendor/gh-feedback.js"></script>
<gh-feedback id="report" trigger="none" repo="zeveck/warren-peace" template="bug.yml" types="bug,feature" theme="dark" color="#e0a030"></gh-feedback>
<script type="module" src="src/main.js"></script>
<script>
  const local = ['localhost', '127.0.0.1'].includes(location.hostname);
  if ('serviceWorker' in navigator && (!local || new URLSearchParams(location.search).has('sw'))) {
    // a waiting update is applied only while the title screen is up (never mid-game: see sw.js), then the page reloads
    let asked = false;
    navigator.serviceWorker.register('sw.js').then(reg => setInterval(() => {
      if (!asked && reg.waiting && navigator.serviceWorker.controller && window.__wpOnTitle && window.__wpOnTitle()) { asked = true; reg.waiting.postMessage('skipWaiting'); }
    }, 2000));
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (asked && window.__wpOnTitle && window.__wpOnTitle()) location.reload(); });
  }
</script>
</body>
</html>
